services:
  - type: web
    name: datix
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS
        sync: false
        # REQUIRED MANUAL STEP: in the Render dashboard, set this to your
        # exact Vercel frontend URL, e.g. https://your-app.vercel.app
        # (no trailing slash, comma-separate multiple origins). If this is
        # left blank, the browser will block every request from your
        # deployed frontend (uploads, chat, everything) with a CORS error.
      # NOTE: Render automatically sets RENDER=true on its platform, which
      # app.py uses to enable secure cross-site session cookies. No action
      # needed here.
